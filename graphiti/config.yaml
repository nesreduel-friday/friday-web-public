# Graphiti MCP-Server — Konfiguration für Friday.
#
# Vorlage: mcp_server/config/config-docker-falkordb.yaml aus getzep/graphiti
# (Stand 11.09.2026, passend zum Image 1.1.0-graphiti-0.30.1). Umgestellt von
# OpenAI auf Gemini. Die Modellnamen aus der Graphiti-Doku ("gemini-2.0-flash",
# "text-embedding-004") kennt Eikes Schlüssel nicht; hier stehen die, die
# GET /v1beta/models tatsächlich liefert.

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "gemini"
  # Eigenes Modell, nicht das des Chats: jedes Modell hat ein eigenes
  # Minutenkontingent. So frisst die Hintergrundverarbeitung Eikes
  # Gesprächen nichts weg.
  model: ${MODEL_NAME:gemini-3.5-flash-lite}
  max_tokens: 4096
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_schema}
  providers:
    gemini:
      api_key: ${GOOGLE_API_KEY}

embedder:
  # Standard Gemini. "openai" = lokaler Embedder (Container `embedder`, OpenAI-kompatibel) — nur nach dem
  # Neu-Einbetten (docs/superpowers/plans/2026-10-04-lokaler-embedder.md): andere Modelle, anderer Vektorraum.
  provider: ${EMBEDDER_PROVIDER_GRAPHITI:gemini}
  model: ${EMBEDDER_MODEL:gemini-embedding-001}
  dimensions: ${EMBEDDER_DIMS:768}
  providers:
    gemini:
      api_key: ${GOOGLE_API_KEY}
    openai:
      api_key: ${EMBEDDER_API_KEY:lokal}
      api_url: ${EMBEDDER_URL:http://embedder:8080/v1}

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://falkordb:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:friday}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:eike}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:eike}
  entity_types:
    # Person und Project ergänzt (12.09.2026): ohne eigenen Typ landeten Menschen
    # als namenlose Allgemein-Entitäten, und Eike wollte nach Themen und Personen
    # sortieren können.
    - name: "Person"
      description: "A specific human being mentioned by name or role: family, friends, classmates, teachers, people in photos (PRIORITIZE for any named person other than the User)"
    - name: "Project"
      description: "Ongoing undertakings with a goal: school projects, presentations, hobbies being built, plans"
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, schools, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, homework, etc.)"
    - name: "Topic"
      description: "Subjects of conversation, interests, school subjects and projects"
